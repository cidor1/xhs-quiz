<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#FFF8EC;
  background-image:radial-gradient(circle at 88% 6%,#FFE7C4 0%,rgba(255,231,196,0) 40%),
                   radial-gradient(circle at 6% 30%,#FFF0D6 0%,rgba(255,240,214,0) 36%);
  color:#2E2A25;-webkit-font-smoothing:antialiased;min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:0 22px 46px;min-height:100vh;display:flex;flex-direction:column}
.topbar{padding:18px 0 0;position:sticky;top:0;z-index:9;background:linear-gradient(#FFF8EC 70%,rgba(255,248,236,0))}
.bar{height:5px;border-radius:99px;background:#F3E3C8;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FFB443,#F2622E);transition:width .35s ease}
.step{font-size:12px;color:#B4A085;margin-top:8px;letter-spacing:.4px;display:flex;justify-content:space-between}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px}
.foot{text-align:center;font-size:11px;color:#C9B9A2;padding-top:18px;letter-spacing:.5px}
.screen{animation:in .38s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.badge{display:inline-block;font-size:12px;color:#C24A1C;background:#FFE6C9;padding:6px 12px;border-radius:99px;letter-spacing:1px;margin-bottom:18px}
h1{font-size:31px;line-height:1.34;margin:0 0 14px;letter-spacing:-.5px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(180deg,transparent 60%,#FFD9A8 60%);padding:0 2px}
.lead{font-size:15px;line-height:1.85;color:#6E6459;margin:0 0 22px}
.steps{background:#fff;border-radius:20px;padding:18px 18px 8px;box-shadow:0 10px 30px rgba(200,150,90,.13);margin-bottom:24px}
.stepItem{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.num{flex:0 0 22px;height:22px;border-radius:50%;background:#FFEBD2;color:#D2601F;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.stepItem p{margin:0;font-size:14px;line-height:1.6;color:#5F564B}
.stepItem b{color:#2E2A25}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;font-size:16px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#FFA13B,#F05A24);color:#fff;box-shadow:0 12px 24px rgba(240,90,36,.26);cursor:pointer;
  font-family:inherit;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.975);box-shadow:0 6px 14px rgba(240,90,36,.22)}
.btn.small{padding:14px;font-size:15px;border-radius:14px}

.qtag{font-size:12px;color:#D2601F;letter-spacing:1.5px;margin-bottom:12px;font-weight:600}
.q{font-size:21px;line-height:1.55;font-weight:700;margin:0 0 24px;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{background:#fff;border:1.5px solid #F2E5D2;border-radius:16px;padding:16px 18px;font-size:15.5px;line-height:1.5;
  color:#3A342C;text-align:left;cursor:pointer;font-family:inherit;transition:.18s;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 12px rgba(200,150,90,.06)}
.opt:active{transform:scale(.985)}
.opt .k{flex:0 0 26px;height:26px;border-radius:9px;background:#FAF0E1;color:#BBA98F;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.right{border-color:#3EBB76;background:#F1FBF4}
.opt.right .k{background:#3EBB76;color:#fff}
.opt.wrong{border-color:#F05A24;background:#FFF3EE}
.opt.wrong .k{background:#F05A24;color:#fff}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}

.fb{margin-top:18px;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 8px 22px rgba(200,150,90,.12);animation:in .3s}
.fb .h{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fb.ok .h{color:#2A9D5C}
.fb.no .h{color:#E0501C}
.fb p{margin:0;font-size:14px;line-height:1.8;color:#6E6459}
.fb .toolbar{margin-top:16px}

.result-head{text-align:center}
.score-ring{width:172px;height:172px;margin:6px auto 18px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .val b{font-size:46px;line-height:1;font-weight:800;letter-spacing:-2px;
  background:linear-gradient(135deg,#FFA13B,#E0501C);-webkit-background-clip:text;background-clip:text;color:transparent}
.score-ring .val span{font-size:11px;color:#B4A085;letter-spacing:2px;margin-top:6px}
.lvl{font-size:26px;font-weight:800;margin:0 0 8px}
.lvlsub{font-size:14.5px;color:#6E6459;line-height:1.8;margin:0 auto 24px;max-width:330px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(200,150,90,.13);margin-bottom:16px;text-align:left}
.card h3{margin:0 0 14px;font-size:15px;color:#2E2A25;display:flex;align-items:center;gap:8px}
.card h3 i{display:inline-block;width:4px;height:15px;border-radius:2px;background:#F05A24}
.rev{padding:13px 0;border-bottom:1px dashed #F0E4D3;font-size:14px;line-height:1.7}
.rev:last-child{border-bottom:0;padding-bottom:0}
.rev .t{font-weight:600;margin-bottom:5px;color:#3A342C}
.rev .w{color:#E0501C;font-size:13.5px}
.rev .r{color:#2A9D5C;font-size:13.5px}
.rev .e{color:#8A7C6C;font-size:13px;margin-top:5px}
.none{font-size:14.5px;line-height:1.85;color:#6E6459}
.actions{margin-top:6px}
</style>

var main = document.getElementById("main");
var bar = document.getElementById("barFill");
var stepL = document.getElementById("stepL"), stepR = document.getElementById("stepR");
var KEYS = ["A","B","C","D"];

function setProgress(p,l,r){ bar.style.width = Math.max(0,Math.min(100,p))+"%"; stepL.textContent=l||""; stepR.textContent=r||""; }
function render(h){ main.innerHTML = '<div class="screen">'+h+'</div>'; window.scrollTo(0,0); }

function cover(){
  idx = 0; answers = []; locked = false;
  setProgress(0,"","");
  render(
    '<span class="badge">童年回忆杀 · 90-00 后</span>' +
    '<h1>全答对的<br><em>说明你真的老了</em></h1>' +
    '<p class="lead">不考知识，只考你小时候有没有真的坐在电视机前。25 道题，动画片、零食、广告、课本，答完给你答案。</p>' +
    '<div class="steps">' +
      '<div class="stepItem"><span class="num">1</span><p><b>25 道题</b>，每题四选一，约 5 分钟</p></div>' +
      '<div class="stepItem"><span class="num">2</span><p><b>答完立刻出解析</b>，告诉你这题当年是怎么回事</p></div>' +
      '<div class="stepItem"><span class="num">3</span><p><b>最后出成绩</b>，看看你算不算标准童年原住民</p></div>' +
    '</div>' +
    '<button class="btn" onclick="start()">开始答题</button>'
  );
}

function start(){ idx = 0; answers = []; draw(); }

function draw(){
  locked = false;
  var q = QS[idx];
  setProgress((idx/QS.length)*100, "第 " + (idx+1) + " 题", (idx+1)+" / "+QS.length);
  var o = "";
  for (var i=0;i<q.a.length;i++){
    o += '<button class="opt" data-i="'+i+'" onclick="pick('+i+')"><span class="k">'+KEYS[i]+'</span>'+q.a[i]+'</button>';
  }
  render('<div class="qtag">童年回忆 · ' + (idx+1) + '</div><h2 class="q">'+q.q+'</h2><div class="opts" id="opts">'+o+'</div>');
}

function pick(i){
  if (locked) return;
  locked = true;
  var q = QS[idx];
  var ok = (i === q.k);
  answers.push({ok:ok, i:i});
  var opts = document.querySelectorAll(".opt");
  for (var j=0;j<opts.length;j++){
    opts[j].setAttribute("disabled","disabled");
    if (j === q.k) opts[j].classList.add("right");
    else if (j === i) opts[j].classList.add("wrong");
    else opts[j].classList.add("dim");
  }
  var o = document.getElementById("opts");
  o.insertAdjacentHTML("afterend",
    '<div class="fb '+(ok?'ok':'no')+'">' +
      '<div class="h">'+(ok?'答对了':'答错了')+'</div>' +
      '<p>'+q.e+'</p>' +
      '<div class="toolbar"><button class="btn small" onclick="next()">'+(idx===QS.length-1?'看结果':'下一题')+'</button></div>' +
    '</div>');
  o.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function next(){
  idx++;
  if (idx < QS.length) draw(); else result();
}

function levelOf(n){
  if (n >= 23) return {t:"童年原住民", d:"你几乎完整地经历那个年代。电视、小卖部、课间十分钟，一个都没落下。"};
  if (n >= 19) return {t:"标准 90 后", d:"底子很扎实，只是有几道细节题被记忆骗了。这才是正常水平。"};
  if (n >= 14) return {t:"半路出家", d:"你知道那个年代的样子，但没有真的住在里面。可能是 00 后，也可能是记忆太好骗。"};
  return {t:"你可能是个假 90 后", d:"别慌，答错不代表没童年，可能只是你的童年比较特别。"};
}

function result(){
  var hit = 0, rev = "";
  for (var i=0;i<answers.length;i++){
    if (answers[i].ok) hit++;
    else {
      var q = QS[i];
      rev += '<div class="rev"><div class="t">'+q.q+'</div>' +
             '<div class="w">你选：'+q.a[answers[i].i]+'</div>' +
             '<div class="r">正确：'+q.a[q.k]+'</div>' +
             '<div class="e">'+q.e+'</div></div>';
    }
  }
  var lv = levelOf(hit);
  var C = 2*Math.PI*74, dash = C*hit/QS.length;
  var ring = '<div class="score-ring"><svg width="172" height="172">' +
    '<circle cx="86" cy="86" r="74" fill="none" stroke="#F5E6CE" stroke-width="11"/>' +
    '<circle cx="86" cy="86" r="74" fill="none" stroke="url(#g2)" stroke-width="11" stroke-linecap="round" ' +
    'stroke-dasharray="'+dash+' '+C+'"/><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#FFB443"/><stop offset="1" stop-color="#E0501C"/></linearGradient></defs></svg>' +
    '<div class="val"><b>'+hit+'</b><span>答对题数</span></div></div>';

  var body = '<div class="result-head">'+ring+'<h2 class="lvl">'+lv.t+'</h2><p class="lvlsub">'+lv.d+'</p></div>';

  if (rev) body += '<div class="card"><h3><i></i>错题回顾（'+(QS.length-hit)+' 题）</h3>'+rev+'</div>';
  else body += '<div class="card"><h3><i></i>满分</h3><p class="none">25 题全对。你的童年记忆保存得比大多数人完整，这不是老，这是真的活过那个年代。</p></div>';

  body += '<div class="actions"><button class="btn" onclick="cover()">再测一次</button></div>';

  setProgress(100,"结果已生成", hit+" / "+QS.length);
  render(body);
}

cover();
</script>
