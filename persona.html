<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#F5F2FF;
  background-image:radial-gradient(circle at 85% 5%,#E4DEFF 0%,rgba(228,222,255,0) 42%),
                   radial-gradient(circle at 5% 35%,#EDE8FF 0%,rgba(237,232,255,0) 38%);
  color:#231F35;-webkit-font-smoothing:antialiased;min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:0 22px 46px;min-height:100vh;display:flex;flex-direction:column}
.topbar{padding:18px 0 0;position:sticky;top:0;z-index:9;background:linear-gradient(#F5F2FF 70%,rgba(245,242,255,0))}
.bar{height:5px;border-radius:99px;background:#E3DDF8;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#A78BFF,#6246EA);transition:width .35s ease}
.step{font-size:12px;color:#A79CC4;margin-top:8px;letter-spacing:.4px;display:flex;justify-content:space-between}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px}
.foot{text-align:center;font-size:11px;color:#BDB4D2;padding-top:18px;letter-spacing:.5px}
.screen{animation:in .38s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.badge{display:inline-block;font-size:12px;color:#5B3FE0;background:#E7E0FF;padding:6px 12px;border-radius:99px;letter-spacing:1px;margin-bottom:18px}
h1{font-size:31px;line-height:1.34;margin:0 0 14px;letter-spacing:-.5px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(180deg,transparent 60%,#D9CEFF 60%);padding:0 2px}
.lead{font-size:15px;line-height:1.85;color:#625A78;margin:0 0 22px}
.steps{background:#fff;border-radius:20px;padding:18px 18px 8px;box-shadow:0 10px 30px rgba(120,100,200,.12);margin-bottom:24px}
.stepItem{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.num{flex:0 0 22px;height:22px;border-radius:50%;background:#EDE7FF;color:#5B3FE0;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.stepItem p{margin:0;font-size:14px;line-height:1.6;color:#564E6C}
.stepItem b{color:#231F35}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;font-size:16px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#8A6BFF,#5738E0);color:#fff;box-shadow:0 12px 24px rgba(87,56,224,.26);cursor:pointer;
  font-family:inherit;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.975);box-shadow:0 6px 14px rgba(87,56,224,.22)}

.qtag{font-size:12px;color:#7A5CF0;letter-spacing:1.5px;margin-bottom:12px;font-weight:600}
.q{font-size:21px;line-height:1.55;font-weight:700;margin:0 0 24px;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{background:#fff;border:1.5px solid #E8E2F7;border-radius:16px;padding:16px 18px;font-size:15.5px;line-height:1.5;
  color:#332C4A;text-align:left;cursor:pointer;font-family:inherit;transition:.18s;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 12px rgba(120,100,200,.06)}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:#C9BBF5}
.opt .k{flex:0 0 26px;height:26px;border-radius:9px;background:#F2EEFD;color:#A99CC9;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

.result-head{text-align:center;margin-bottom:8px}
.type-name{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0 0 10px;line-height:1.25;
  background:linear-gradient(135deg,#8A6BFF,#4B2BD0);-webkit-background-clip:text;background-clip:text;color:transparent}
.type-sub{font-size:14px;color:#7A6F94;letter-spacing:1px;margin:0 0 22px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(120,100,200,.12);margin-bottom:14px;text-align:left}
.card h3{margin:0 0 10px;font-size:14px;color:#5B3FE0;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.card h3 i{display:inline-block;width:4px;height:14px;border-radius:2px;background:#7A5CF0}
.card p{margin:0;font-size:14.5px;line-height:1.85;color:#4E4664}
.meter{margin-top:4px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.meter .row b{font-size:30px;font-weight:800;letter-spacing:-1px;color:#4B2BD0}
.meter .row span{font-size:12px;color:#9A8FBB;letter-spacing:1px}
.track{height:9px;border-radius:99px;background:#EEE9FB;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A78BFF,#4B2BD0);width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.note{font-size:13.5px;line-height:1.8;color:#8A7FA6;margin-top:12px}
.actions{margin-top:8px}
</style>

  transform: translateX(-50%);

  content: '';

  width: 8px;

  opacity: 0;

  <main id="main"><div class="screen"><span class="badge">隐藏人格 · 精神状态测试</span><h1>你的社交面具<br><em>戴了多久了</em></h1><p class="lead">不问你是什么型，只问你在具体场景里会怎么做。20 道题，选第一反应，别选“应该”的那个。</p><div class="steps"><div class="stepItem"><span class="num">1</span><p><b>20 个真实场景</b>，没有标准答案</p></div><div class="stepItem"><span class="num">2</span><p><b>别思考</b>，凭第一反应选，越真实越准</p></div><div class="stepItem"><span class="num">3</span><p><b>出结果</b>：别人眼里的你 / 真实的你 / 面具耗电指数</p></div></div><button class="btn" onclick="start()">开始测试</button></div></main>

function render(h){ main.innerHTML = '<div class="screen">'+h+'</div>'; window.scrollTo(0,0); }

      '<div class="stepItem"><span class="num">1</span><p><b>20 个真实场景</b>，没有标准答案</p></div>' +

function start(){ idx = 0; eSum = 0; mSum = 0; sSum = 0; draw(); }

  var o = "";
  for (var i=0;i<q.a.length;i++){
    o += '<button class="opt" onclick="pick('+i+')"><span class="k">'+KEYS[i]+'</span>'+q.a[i]+'</button>';
  }
  render('<div class="qtag">场景 · ' + (idx+1) + '</div><h2 class="q">'+q.q+'</h2><div class="opts">'+o+'</div>');
}

function pick(i){
  var w = QS[idx].w[i];
  eSum += w[0]; mSum += w[1]; sSum += w[2];
  idx++;
  if (idx < QS.length) draw(); else result();
}

function result(){
  var eAvg = eSum / QS.length, mAvg = mSum / QS.length, sAvg = sSum / QS.length;
  var eH = eAvg >= 0.3 ? "1" : "0";
  var mH = mAvg >= 1.2 ? "1" : "0";
  var sH = sAvg >= 0 ? "1" : "0";
  var key = eH + mH + sH;
  var t = TYPES[key] || TYPES["000"];

  var drain = Math.round(35 + mAvg * 18 - sAvg * 10);
  if (drain < 12) drain = 12; if (drain > 97) drain = 97;

  var drainWord = drain >= 80 ? "极高，建议今天早点回家" : drain >= 60 ? "偏高，需要定期断电" : drain >= 40 ? "中等，还算可控" : "很低，你活得挺省电";

  var body =
    '<div class="result-head">' +
      '<div class="type-name">' + t.n + '</div>' +
      '<p class="type-sub">' + t.s + '</p>' +
    '</div>' +
    '<div class="card"><h3><i></i>别人眼里的你</h3><p>' + t.other + '</p></div>' +
    '<div class="card"><h3><i></i>真实的你</h3><p>' + t.real + '</p></div>' +
    '<div class="card"><h3><i></i>面具耗电指数</h3>' +
      '<div class="meter"><div class="row"><b>' + drain + '%</b><span>' + drainWord + '</span></div>' +
      '<div class="track"><i id="mk"></i></div>' +
      '<p class="note">这个数字代表：维持“别人眼里的你”需要消耗多少能量。' + t.tip + '</p></div>' +
    '<div class="actions"><button class="btn" onclick="cover()">再测一次</button></div>';

  setProgress(100,"结果已生成","100%");
  render(body);

  setTimeout(function(){
    var mk = document.getElementById("mk");
    if (mk) mk.style.width = drain + "%";
  }, 120);
}

cover();
</script>
